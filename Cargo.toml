[package]
name = "warrant"
version = "0.0.1"
edition = "2021"
description = "Warrant: a verified, parallel language for AI agents (M0 prototype)"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "warrant"
path = "src/main.rs"

[dependencies]
rayon = "1.11.0"

[profile.release]
debug = 1

# Every target. clippy.toml lists the disallowed methods and why; src/lib.rs
# adds the lints that hold only for the library.
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_methods = "deny"
