name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.0"
  Z3_VERSION: "5.1.0"
  Z3_SHA256: f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
      - name: Install z3
        run: .github/install-z3.sh
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: cargo clippy --release --all-targets --locked -- -D warnings

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install z3
        run: .github/install-z3.sh
      # Shared runners are noisy, so only a large slowdown fails the job.
      - run: scripts/bench-compare.sh "${{ github.event.pull_request.base.sha }}" examples/msort.wrt 5 15

  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install z3
        run: .github/install-z3.sh
      - name: Install perf and inferno
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq linux-tools-common "linux-tools-$(uname -r)"
          sudo sysctl -w kernel.perf_event_paranoid=1
          cargo install inferno --version 0.12.8 --locked
      - name: Profile msort
        run: |
          mkdir -p profile
          cargo build --release --locked
          for mode in auto runtime; do
            target/release/warrant run examples/msort.wrt --report --contracts "$mode" --no-cache > "profile/report-$mode.sexp"
          done
          cat profile/report-auto.sexp
          scripts/flamegraph.sh examples/msort.wrt profile/flamegraph.svg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile
          path: profile/

  tla:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: formal/tla/check.sh

  lean:
    runs-on: ubuntu-24.04
    env:
      ELAN_VERSION: v4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install elan
        run: |
          curl -sSfLO "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c
          tar xzf elan-x86_64-unknown-linux-gnu.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: formal/lean/check.sh
